backend:
  name: github
  repo: iaegperu/web-iaegperu       # owner/repo on GitHub
  branch: main                      # branch Decap CMS will edit
  base_url: https://cms-oauth-steel.vercel.app   # your OAuth gateway on Vercel
  auth_endpoint: auth               # route exposed by the gateway
media_folder: "src/assets/images"
public_folder: "/assets/images"
collections:
  - name: "news"
    label: "News (Posts)"           
    label_singular: "News item"
    folder: "src/news"              
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "Featured image", name: "image", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - label: "Attached PDF (optional)"
        name: "pdf"
        widget: "file"
        required: false
        media_folder: "src/assets/documents"
        public_folder: "/assets/documents"
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "committees"
    label: "Committees (Posts)"
    label_singular: "Committee"
    folder: "src/committees"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Short summary (shown on Committees page)", name: "summary", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

      - label: "Areas of work"
        name: "areas"
        widget: "list"
        required: false
        hint: "Add the broad areas of work of the committee. Example: Disaster Risk Management, Geosciences and Natural Processes."
        field:
          label: "Area"
          name: "item"
          widget: "string"

      - label: "Lines of work"
        name: "workLines"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text", required: false }

      - label: "Activities"
        name: "activities"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Status", name: "status", widget: "select", options: ["Upcoming", "Ongoing", "Completed"], required: false }
          - { label: "Date or period", name: "date", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Link label", name: "buttonLabel", widget: "string", required: false }
          - { label: "Link URL", name: "buttonUrl", widget: "string", required: false }

      - label: "Publications and knowledge"
        name: "publications"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - "White Paper"
              - "Scientific article"
              - "Technical article"
              - "Technical document"
              - "Working paper"
              - "Statement"
              - "Technical note"
              - "Training material"
              - "Other"
          - { label: "Year", name: "year", widget: "string", required: false }
          - { label: "Short description", name: "description", widget: "text", required: false }
          - { label: "PDF or document", name: "file", widget: "file", required: false, media_folder: "src/assets/documents", public_folder: "/assets/documents" }
          - { label: "External URL (optional)", name: "url", widget: "string", required: false }
          - { label: "Button label", name: "buttonLabel", widget: "string", default: "View document", required: false }

      - label: "Featured links and buttons"
        name: "featuredLinks"
        widget: "list"
        required: false
        hint: "Use this section for clear calls to action, such as View publications, Upcoming events, Geological hazards blog, or Participate."
        summary: "{{fields.label}}"
        fields:
          - { label: "Button text", name: "label", widget: "string" }
          - { label: "Link URL", name: "url", widget: "string" }
          - label: "Style"
            name: "style"
            widget: "select"
            options: ["Primary", "Secondary", "Outline"]
            default: "Primary"
          - { label: "Open in new tab", name: "newTab", widget: "boolean", default: false }

      - label: "Events"
        name: "committeeEvents"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Category"
            name: "category"
            widget: "select"
            options: ["Upcoming event", "Past event", "Participation in event"]
          - { label: "Date or period", name: "date", widget: "string", required: false }
          - { label: "Location", name: "location", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "Event link", name: "url", widget: "string", required: false }

      - label: "Alliances and cooperation"
        name: "alliances"
        widget: "list"
        required: false
        hint: "Add only institutions with an actual collaboration, agreement, joint activity, or cooperation in progress."
        summary: "{{fields.name}}"
        fields:
          - { label: "Organization name", name: "name", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Type of cooperation", name: "description", widget: "text", required: false }
          - { label: "Website URL", name: "url", widget: "string", required: false }
          - { label: "MoU or agreement URL (optional)", name: "mouUrl", widget: "string", required: false }

      - label: "Committee members"
        name: "members"
        widget: "list"
        required: false
        summary: "{{fields.role}} — {{fields.name}}"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
          - { label: "Photo", name: "photo", widget: "image", required: false }
          - { label: "Professional profile / bio", name: "bio", widget: "text", required: false }
          - { label: "LinkedIn or profile URL", name: "url", widget: "string", required: false }

      - label: "Participation and collaboration"
        name: "collaboration"
        widget: "object"
        required: false
        fields:
          - { label: "Section title", name: "title", widget: "string", default: "Participate / Collaborate with the Committee" }
          - { label: "Text", name: "text", widget: "text", required: false }
          - { label: "Button text", name: "buttonLabel", widget: "string", default: "Contact the Committee" }
          - { label: "Button link", name: "buttonUrl", widget: "string", default: "mailto:iaeg.peru@gmail.com" }

      - label: "Volunteers of the Year"      
        name: "volunteers"
        widget: "list"
        required: false
        hint: "Agrega una entrada por cada voluntario/a. No importa el orden en que las agregues — la página los agrupa y ordena por año automáticamente (2021 en adelante)."
        summary: "{{fields.year}} — {{fields.name}}"
        fields:
          - { label: "Year", name: "year", widget: "string" }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role / Degree", name: "role", widget: "string" }
          - { label: "Photo", name: "photo", widget: "image", required: false }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
  - name: "pages"
    label: "Site pages"             
    label_singular: "Page"
    files:
      - label: "Home"
        name: "home"
        file: "src/index.html"
        fields:
          - { label: "Title (browser tab)", name: "title", widget: "string", required: false }
          - { label: "Meta description", name: "description", widget: "text", required: false }

          - { label: "Hero — Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero — Title", name: "heroTitle", widget: "string" }
          - label: "Hero — Lead paragraph"
            name: "heroLead"
            widget: "markdown"
            hint: "You can use bold, italics, links, and bullet lists here."
            buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
            editor_components: []
          - { label: "Hero — Background image", name: "heroImage", widget: "image" }
          - { label: "Hero — Button 1 label", name: "heroCtaLabel1", widget: "string" }
          - { label: "Hero — Button 1 link", name: "heroCtaUrl1", widget: "string" }
          - { label: "Hero — Button 2 label", name: "heroCtaLabel2", widget: "string" }
          - { label: "Hero — Button 2 link", name: "heroCtaUrl2", widget: "string" }

          - { label: "Stats — \"Active Committees\" label (number is automatic)", name: "statsCommitteesLabel", widget: "string" }
          - { label: "Stats — Partner Institutions suffix (e.g. \"+\") — the number itself is automatic", name: "statsPartnersSuffix", widget: "string", required: false }
          - { label: "Stats — Partner Institutions label", name: "statsPartnersLabel", widget: "string" }
          - { label: "Stats — Founded year", name: "statsFounded", widget: "string" }
          - { label: "Stats — Founded label", name: "statsFoundedLabel", widget: "string" }

          - { label: "What We Do — Eyebrow", name: "whatWeDoEyebrow", widget: "string" }
          - { label: "What We Do — Title", name: "whatWeDoTitle", widget: "string" }
          - label: "What We Do — Cards"
            name: "whatWeDoCards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Use live preview of destination page instead of image? (recommended — always accurate)", name: "livePreview", widget: "boolean", default: false }
              - { label: "Tag (small label)", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Link text", name: "linkText", widget: "string" }
              - { label: "Link URL", name: "linkUrl", widget: "string" }

          - { label: "Latest — Eyebrow", name: "latestEyebrow", widget: "string" }
          - { label: "Latest — Title", name: "latestTitle", widget: "string" }
          - label: "Latest — Cards (News & Events)"
            name: "latestCards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Tag (small label)", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Link text", name: "linkText", widget: "string" }
              - { label: "Link URL", name: "linkUrl", widget: "string" }
      - label: "About Us"
        name: "about"
        file: "src/about.html"
        fields:
          - { label: "Title (browser tab)", name: "title", widget: "string", required: false }

          - { label: "Hero — Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero — Title", name: "heroTitle", widget: "string" }
          - { label: "Hero — Lead paragraph", name: "heroLead", widget: "text" }
          - { label: "Hero — Background image", name: "heroImage", widget: "image" }

          - { label: "Mission — Eyebrow", name: "missionEyebrow", widget: "string" }
          - { label: "Mission — Title", name: "missionTitle", widget: "string" }
          - { label: "Mission — Paragraph 1", name: "missionText1", widget: "text" }
          - { label: "Mission — Paragraph 2 (optional)", name: "missionText2", widget: "text", required: false }
          - { label: "Mission — Image", name: "missionImage", widget: "image", required: false }

          - { label: "Vision — Eyebrow", name: "visionEyebrow", widget: "string" }
          - { label: "Vision — Title", name: "visionTitle", widget: "string" }
          - { label: "Vision — Text", name: "visionText", widget: "text" }
          - label: "Vision — Strategic priorities"
            name: "priorities"
            widget: "list"
            field: { label: "Priority", name: "item", widget: "string" }

          - { label: "Values — Eyebrow", name: "valuesEyebrow", widget: "string" }
          - { label: "Values — Title", name: "valuesTitle", widget: "string" }
          - label: "Values — List"
            name: "values"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - { label: "Executive Committee — Eyebrow", name: "execEyebrow", widget: "string" }
          - { label: "Executive Committee — Title", name: "execTitle", widget: "string" }
          - { label: "Executive Committee — Intro text", name: "execIntro", widget: "text", required: false }
          - label: "Executive Committee — Members"
            name: "committee"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Button label", name: "buttonLabel", widget: "string", default: "Message" }
              - { label: "Button link (email or URL)", name: "buttonUrl", widget: "string", required: false }

          - { label: "Recognition — Eyebrow", name: "recognitionEyebrow", widget: "string" }
          - { label: "Recognition — Title", name: "recognitionTitle", widget: "string" }
          - { label: "Recognition — Image", name: "recognitionImage", widget: "image", required: false }
          - { label: "Use live preview of destination page instead of image? (recommended — always accurate)", name: "recognitionLivePreview", widget: "boolean", default: true }
          - { label: "Recognition — Heading", name: "recognitionHeading", widget: "string" }
          - { label: "Recognition — Text", name: "recognitionText", widget: "text" }
          - { label: "Recognition — Link text", name: "recognitionLinkText", widget: "string", required: false }
          - { label: "Recognition — Link URL", name: "recognitionLinkUrl", widget: "string", required: false }

          - { label: "Why Join Us — Eyebrow", name: "whyJoinEyebrow", widget: "string" }
          - { label: "Why Join Us — Title", name: "whyJoinTitle", widget: "string" }
          - { label: "Why Join Us — Text", name: "whyJoinText", widget: "text" }
          - label: "Why Join Us — Points"
            name: "whyJoinPoints"
            widget: "list"
            field: { label: "Point", name: "item", widget: "string" }
      - label: "Projects"           
        name: "projects_page"
        file: "src/projects.html"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Project List"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Status", name: "status", widget: "string", required: false }
              - { label: "Cover image", name: "image", widget: "image", required: false }
              - label: "Description"
                name: "description"
                widget: "markdown"
                required: false
                hint: "You can use bold, italics, links, and bullet lists here."
                buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
                editor_components: []
              - label: "Photo gallery (optional)"
                name: "gallery"
                widget: "list"
                required: false
                field: { label: "Photo", name: "photo", widget: "image" }
              - label: "Website link (optional)"
                name: "websiteUrl"
                widget: "string"
                required: false
                hint: "Adds a \"Visit website\" button. Leave empty to hide it."
      - label: "Partners"           
        name: "partners_page"
        file: "src/partners.html"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "Partner organizations"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Short description", name: "description", widget: "text", required: false }
              - { label: "Button label", name: "buttonLabel", widget: "string", default: "Website" }
              - { label: "Button link", name: "buttonUrl", widget: "string", required: false }
              - { label: "MoU link", name: "mouUrl", widget: "string", required: false }
      - label: "News"               
        name: "news_page"
        file: "src/news.html"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Content/Intro", name: "body", widget: "markdown", required: false }
      - label: "Events"             
        name: "events_page"
        file: "src/events.html"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "Event List"
            name: "events"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date label (short, for the badge)", name: "dateLabel", widget: "string", hint: "e.g. SEP 2-4, 2026" }
              - { label: "Full date/time", name: "dateFull", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Event link (View Event button)", name: "eventUrl", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "International events note", name: "internationalNote", widget: "text", required: false }
          - { label: "International events link", name: "internationalUrl", widget: "string", required: false }
      - label: "Committees"
        name: "committees_page"
        file: "src/committees.html"
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
      - label: "Site Settings (Header & Footer)"
        name: "site_settings"
        file: "src/_data/site.json"
        fields:
          - { label: "Site name", name: "name", widget: "string" }
          - { label: "Tagline (shown under the logo)", name: "tagline", widget: "string" }
          - { label: "Site URL", name: "url", widget: "string" }
          - { label: "Site description (used in footer & meta tags)", name: "description", widget: "text" }
          - label: "Navigation menu"
            name: "menu"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Label", name: "name", widget: "string" }
              - { label: "Link", name: "url", widget: "string" }
              - label: "Submenu items (optional — leave empty for a simple link)"
                name: "children"
                widget: "list"
                required: false
                summary: "{{fields.name}}"
                fields:
                  - { label: "Label", name: "name", widget: "string" }
                  - { label: "Link", name: "url", widget: "string" }
          - label: "Social media links (footer)"
            name: "socialLinks"
            widget: "list"
            summary: "{{fields.platform}}"
            fields:
              - label: "Platform"
                name: "platform"
                widget: "select"
                options: ["Facebook", "Instagram", "X", "LinkedIn", "YouTube"]
              - label: "Profile URL"
                name: "url"
                widget: "string"
                required: false
                hint: "Leave empty to hide this icon in the footer."
          - { label: "Copyright text (footer)", name: "copyrightText", widget: "string" }
          - { label: "Footer domain label (e.g. iaegperu.org)", name: "footerDomainLabel", widget: "string" }
